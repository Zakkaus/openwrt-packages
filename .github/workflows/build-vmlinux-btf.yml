name: Build vmlinux (BTF)

# =============================================================================
# Reference implementation:
#   https://github.com/QiuSimons/vmlinux-btf/blob/master/Makefile
#   src/shadow_btf_{core,modules,private}.c are vendored from that repository
#
# Upstream produces the detached BTF blob without building a kernel: a few small
# stub units include the key kernel headers, so the compiler emits the exact
# struct layouts of the target kernel, and pahole converts that DWARF into the
# .BTF data that libbpf and bpftool expect.
#
# This workflow does the same, taking every input from the official OpenWrt SDK
# of each target, so neither a full OpenWrt buildroot nor a kernel build is
# needed:
#
#   1. Download the SDK published for the target/subtarget
#   2. Take from it: the kernel tree OpenWrt already prepared (headers, the
#      generated include trees, autoconf.h of that target's .config), the cross
#      toolchain and the staging_dir layout
#   3. Compile src/shadow_btf_*.c with the SDK gcc and the upstream flag set
#   4. ld -r the objects into one stub object
#   5. pahole --btf_encode_detached to write the detached BTF blob
#   6. Verify the blob (BTF magic and header) and that sk_buff is described
#
# The compiler is OpenWrt's own: the gcc/binutils of the SDK toolchain is put on
# PATH and used as CROSS_COMPILE, so the stubs are compiled with the same GCC
# that OpenWrt uses for that target. Host tools (pahole) come from the runner,
# which is also what upstream's CI does.
#
# Only headers are needed, never the kernel sources: the SDK ships the kernel
# tree already extracted and configured (headers, Module.symvers and the
# prebuilt modules) with the .c files stripped, which is exactly the input this
# approach wants.
#
# Every OpenWrt input is downloaded from the official downloads server
# (downloads.openwrt.org), with openwrt.pixeldeck.net as a fallback mirror: both
# serve the same release tree, so only the host differs. The prepare job picks
# the host that serves the requested release and records the other one as the
# fallback for the build jobs, and every job downloads the SDK through
# scripts/fetch-openwrt-sdk.sh, which retries on the fallback and checks each
# download against the sha256sums published in the same directory. Every URL
# that is used is printed: prepare logs each request and lists the SDK URL (and
# its fallback) of every target in the job summary, and the script prints the
# tarball, the checksum file and the host each download finally came from.
#
# Targets built here, named by their OpenWrt architecture (arch_packages):
#   x86_64             -> x86/64
#   aarch64_generic    -> armsr/armv8
#   aarch64_cortex-a53 -> mediatek/filogic
#   aarch64_cortex-a72 -> bcm27xx/bcm2711
#   aarch64_cortex-a76 -> bcm27xx/bcm2712
#
# Several targets share the same arch_packages, so the list below picks one
# representative target/subtarget per architecture. If a device needs a
# different kernel .config, swap in another target/subtarget that reports the
# same arch_packages (check profiles.json of that target).
#
# Three packages are built from this repository, whose root doubles as an
# OpenWrt feed, and published in the same release, one per OpenWrt
# architecture:
#   vmlinux-btf/ - package "vmlinux-btf": the detached BTF blob of that
#           architecture, installed as /usr/lib/debug/boot/vmlinux plus the
#           vmlinux-<kernel.release> symlink; its version is the kernel version
#   dae/  - package "dae": Go, statically linked (CGO_ENABLED=0); no target C
#           compiler is involved, its eBPF objects are compiled by clang
#   honk/ - package "honk": Rust, cross compiled with the OpenWrt SDK toolchain:
#           its C/C++ dependencies (BoringSSL, SQLite) are built by the SDK
#           gcc/g++, and it links against the musl of that SDK, so the device
#           needs libstdcpp. The full feature set is enabled (clash-api,
#           mimalloc, rprx, ebpf, native-ui): native-ui embeds the doona
#           dashboard downloaded from its release, so the UI is not built here.
# These jobs only provide the toolchains (Go release tarball, rustup's prebuilt
# toolchains, the prebuilt bpf-linker) and then let the SDK build the packages,
# so the assets are real OpenWrt packages (.apk on 25.x, .ipk on older releases).
#
# Naming of the assets:
#   <openwrt_version>-vmlinux-<openwrt_arch>-<kernel_version>.tar.xz
#   <openwrt_version>-vmlinux-btf-<openwrt_arch>-<kernel_version>.apk
#   <openwrt_version>-dae-<dae_version>-<openwrt_arch>.apk
#   <openwrt_version>-honk-<honk_version>-<openwrt_arch>.apk
#   e.g. 25.12.5-vmlinux-btf-aarch64_cortex-a53-6.12.94.apk
# Each vmlinux archive holds a single file named "vmlinux": the detached BTF
# data, which is the same file upstream installs as
# /usr/lib/debug/boot/vmlinux (plus the vmlinux-<release> symlink on the
# device). The vmlinux-btf package ships exactly that file, so a device can get
# it with "apk add" instead of unpacking the archive.
#
# Signing: keys/public-key.pem in this repository is the public half of the key
# the packages are signed with; the private half is the PRIVATE_KEY secret and
# never a file in git. scripts/setup-signing-key.sh writes it back to
# keys/private-key.pem (the path .gitignore reserves), checks it against the
# committed public key and links it where the SDK signs with it; the SDK then
# signs every package it builds (CONFIG_SIGN_EACH_PACKAGE), each build job
# verifies the result against the committed public key, and the release attaches
# public-key.pem so a device can verify the packages by copying it to
# /etc/apk/keys/. That is what removes the need for --allow-untrusted. .ipk
# packages (24.10 and older) carry no per-package signature - opkg verifies
# signed package lists, not single files - so those assets are published with
# their .sha256 only. Without the secret the packages are published unsigned
# and a warning explains it.
#
# The userspace packages are pinned to upstream releases and therefore do not
# depend on the kernel version (the versions live in the prepare job):
#   dae  - tag v2.1.1,            package version 2.1.1
#   honk - tag v0.1.0-beta.1,     package version 0.1.0_beta1
# apk spells a pre-release with "_beta" ("~" is reserved for a commit hash), so
# the honk tag cannot be used verbatim as the package version. The package
# version is the version the binaries report as well: it is passed to the
# package Makefiles as DAE_VERSION / HONK_VERSION, dae's own make receives it as
# VERSION, and honk derives what it embeds from GITHUB_REF, so build.sh exports
# a "refs/tags/v0.1.0-beta.1" ref for it.
#
# All architectures sharing the same kernel version are published together in
# one GitHub Release with the gh CLI, tagged:
#   openwrt-<openwrt_version>-<kernel_version>-<date>
#   e.g. openwrt-25.12.5-6.12.94-20261024
# <date> is the UTC date of the run, the same for every kernel version it
# publishes. The tag is checked first and only created when it does not exist
# yet; existing assets are overwritten on re-runs, so a second run on the same
# day reuses that day's release. The asset names do not carry the date.
#
# Note: the five builds run in parallel and take a few minutes each, mostly the
# SDK download. Trim the target list below if your plan limits concurrent jobs.
#
# Usage: Actions -> Build vmlinux (BTF) -> Run workflow -> enter an OpenWrt version
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release version (e.g. 25.12.6)"
        required: true
        default: "25.12.6"

permissions:
  contents: read

concurrency:
  group: build-vmlinux
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the SDK, the kernel version and the build matrix
  # ---------------------------------------------------------------------------
  prepare:
    name: Resolve OpenWrt SDKs
    runs-on: ubuntu-latest
    outputs:
      openwrt_version: ${{ steps.resolve.outputs.openwrt_version }}
      release_date: ${{ steps.resolve.outputs.release_date }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve SDK, kernel version and matrix
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version }}
        run: |
          set -euo pipefail

          OPENWRT_VERSION="$(echo "${INPUT_VERSION}" | tr -d '[:space:]')"
          OPENWRT_VERSION="${OPENWRT_VERSION#v}"

          if ! [[ "${OPENWRT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Malformed OpenWrt version '${INPUT_VERSION}' - expected a release version such as 25.12.6"
            exit 1
          fi

          # OpenWrt resources come from the official downloads server, with
          # openwrt.pixeldeck.net as a fallback: both serve the same release
          # tree, so only the host differs. The fallback covers the official
          # host being unreachable or slow, and releases the official tree has
          # already rotated into archive.openwrt.org.
          OPENWRT_MIRRORS=(
            "https://downloads.openwrt.org"
            "https://ftp.nluug.nl/os/Linux/distr/openwrt"
            "https://openwrt.pixeldeck.net"
          )

          BASE=""
          FALLBACK_BASE=""
          for mirror in "${OPENWRT_MIRRORS[@]}"; do
            if ! curl -fsIL --http1.1 --connect-timeout 20 --max-time 60 \
              "${mirror}/releases/${OPENWRT_VERSION}/" >/dev/null; then
              echo "::warning::OpenWrt ${OPENWRT_VERSION} is not available at ${mirror}"
              continue
            fi
            if [ -z "${BASE}" ]; then
              BASE="${mirror}/releases/${OPENWRT_VERSION}"
            else
              FALLBACK_BASE="${mirror}/releases/${OPENWRT_VERSION}"
              break
            fi
          done
          if [ -z "${BASE}" ]; then
            echo "::error::OpenWrt ${OPENWRT_VERSION} is not available at any of: ${OPENWRT_MIRRORS[*]}"
            exit 1
          fi
          echo "OpenWrt release tree: ${BASE} (fallback: ${FALLBACK_BASE:-none})"

          # Takes the file from the fallback mirror when the primary does not
          # serve it, so a single missing file does not fail the whole matrix.
          # Each attempt is printed, so the log names every URL that was used.
          fetch() {
            local urls=("${BASE}/$1") url
            if [ -n "${FALLBACK_BASE}" ]; then
              urls+=("${FALLBACK_BASE}/$1")
            fi
            for url in "${urls[@]}"; do
              echo "GET ${url}" >&2
              if curl -fsSL --http1.1 --retry 2 --retry-delay 3 --connect-timeout 20 \
                --max-time 60 "${url}"; then
                return 0
              fi
              echo "::warning::${url} did not return the file" >&2
            done
            return 1
          }

          # The userspace packages are pinned to upstream releases. The package
          # version is what the binaries report as well, so it is passed to the
          # package Makefiles. honk is tagged v0.1.0-beta.1, but apk spells a
          # beta pre-release with "_beta" ("~" means a commit hash), hence
          # 0.1.0_beta1 while the sources come from the tag itself.
          DAE_VERSION="2.1.1"
          DAE_GIT_TAG="v2.1.1"
          HONK_VERSION="0.1.0_beta1"
          HONK_GIT_TAG="v0.1.0-beta.1"
          echo "Userspace versions: dae ${DAE_VERSION} (${DAE_GIT_TAG}), honk ${HONK_VERSION} (${HONK_GIT_TAG})"

          # One UTC date for every release of this run, so all kernel versions
          # share it even if the run crosses midnight. Release tags append it;
          # the asset names do not.
          RELEASE_DATE="$(date -u +%Y%m%d)"
          echo "Release date: ${RELEASE_DATE}"

          : > /tmp/matrix.jsonl
          : > /tmp/sdk-urls.md
          {
            echo "### OpenWrt ${OPENWRT_VERSION}"
            echo ""
            echo "Resources: \`${BASE}\`"
            echo ""
            echo "Fallback mirror: \`${FALLBACK_BASE:-none}\`"
            echo ""
            echo "| OpenWrt arch | target/subtarget | kernel | SDK |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # The expected arch_packages is verified against profiles.json, so a
          # wrong target/subtarget pairing fails here instead of silently
          # producing a vmlinux for the wrong architecture.
          while IFS='|' read -r openwrt_arch target subtarget kernel_arch; do
            case "${openwrt_arch}" in
              "" | "#"*) continue ;;
            esac

            url="${BASE}/targets/${target}/${subtarget}"

            if ! profiles="$(fetch "targets/${target}/${subtarget}/profiles.json")"; then
              echo "::error::profiles.json of ${target}/${subtarget} is not available on any mirror"
              exit 1
            fi
            got_arch="$(echo "${profiles}" | jq -r '.arch_packages')"
            kernel_version="$(echo "${profiles}" | jq -r '.linux_kernel.version // empty')"

            if [ "${got_arch}" != "${openwrt_arch}" ]; then
              echo "::error::${target}/${subtarget} reports arch_packages=${got_arch}, expected ${openwrt_arch}"
              exit 1
            fi
            if [ -z "${kernel_version}" ]; then
              echo "::error::${target}/${subtarget} does not report a kernel version in profiles.json"
              exit 1
            fi

            if ! index="$(fetch "targets/${target}/${subtarget}/")"; then
              echo "::error::The file list of ${target}/${subtarget} is not available on any mirror"
              exit 1
            fi
            sdk_name="$(echo "${index}" | grep -oE 'openwrt-sdk-[^"<>]*\.tar\.(zst|xz)' | head -n1)"
            if [ -z "${sdk_name}" ]; then
              echo "::error::OpenWrt ${OPENWRT_VERSION} publishes no SDK for ${target}/${subtarget}"
              exit 1
            fi

            # The tarball this target is built from, on both hosts when the
            # mirror is in play, so the log and the summary name every URL
            sdk_url="${url}/${sdk_name}"
            sdk_fallback_url=""
            if [ -n "${FALLBACK_BASE}" ]; then
              sdk_fallback_url="${FALLBACK_BASE}/targets/${target}/${subtarget}/${sdk_name}"
            fi
            echo "SDK for ${target}/${subtarget}: ${sdk_url}"
            if [ -n "${sdk_fallback_url}" ]; then
              echo "SDK fallback for ${target}/${subtarget}: ${sdk_fallback_url}"
            fi
            {
              echo "- \`${openwrt_arch}\` (${target}/${subtarget}): \`${sdk_url}\`"
              if [ -n "${sdk_fallback_url}" ]; then
                echo "  - fallback: \`${sdk_fallback_url}\`"
              fi
            } >> /tmp/sdk-urls.md

            dist_name="${OPENWRT_VERSION}-vmlinux-${openwrt_arch}-${kernel_version}"
            # The BTF package depends on the kernel, so its version (and name)
            # carries the kernel version; the userspace packages are pinned to
            # upstream releases and only carry that version, so they are named
            # here and reused by the build and release jobs
            btf_dist_name="${OPENWRT_VERSION}-vmlinux-btf-${openwrt_arch}-${kernel_version}"
            dae_dist_name="${OPENWRT_VERSION}-dae-${DAE_VERSION}-${openwrt_arch}"
            honk_dist_name="${OPENWRT_VERSION}-honk-${HONK_VERSION}-${openwrt_arch}"

            jq -nc \
              --arg openwrt_arch "${openwrt_arch}" \
              --arg target "${target}" \
              --arg subtarget "${subtarget}" \
              --arg kernel_arch "${kernel_arch}" \
              --arg kernel_version "${kernel_version}" \
              --arg sdk_url "${sdk_url}" \
              --arg sdk_fallback_url "${sdk_fallback_url}" \
              --arg sdk_name "${sdk_name}" \
              --arg dist_name "${dist_name}" \
              --arg btf_dist_name "${btf_dist_name}" \
              --arg dae_version "${DAE_VERSION}" \
              --arg dae_git_tag "${DAE_GIT_TAG}" \
              --arg dae_dist_name "${dae_dist_name}" \
              --arg honk_version "${HONK_VERSION}" \
              --arg honk_git_tag "${HONK_GIT_TAG}" \
              --arg honk_dist_name "${honk_dist_name}" \
              '{openwrt_arch:$openwrt_arch,target:$target,subtarget:$subtarget,kernel_arch:$kernel_arch,kernel_version:$kernel_version,sdk_url:$sdk_url,sdk_fallback_url:$sdk_fallback_url,sdk_name:$sdk_name,dist_name:$dist_name,btf_dist_name:$btf_dist_name,dae_version:$dae_version,dae_git_tag:$dae_git_tag,dae_dist_name:$dae_dist_name,honk_version:$honk_version,honk_git_tag:$honk_git_tag,honk_dist_name:$honk_dist_name}' \
              >> /tmp/matrix.jsonl

            echo "| ${openwrt_arch} | ${target}/${subtarget} | ${kernel_version} | ${sdk_name} |" >> "$GITHUB_STEP_SUMMARY"
          done <<'TARGETS'
          # openwrt_arch|target|subtarget|kernel_arch
          x86_64|x86|64|x86_64
          aarch64_generic|armsr|armv8|arm64
          aarch64_cortex-a53|mediatek|filogic|arm64
          aarch64_cortex-a72|bcm27xx|bcm2711|arm64
          aarch64_cortex-a76|bcm27xx|bcm2712|arm64
          TARGETS

          echo "Resolved $(wc -l < /tmp/matrix.jsonl) targets"

          {
            echo ""
            echo "Packages: vmlinux-btf \`<kernel version>\` (one per architecture), dae \`${DAE_VERSION}\` (tag \`${DAE_GIT_TAG}\`), honk \`${HONK_VERSION}\` (tag \`${HONK_GIT_TAG}\`, full feature set with the embedded doona UI)."
            echo ""
            echo "Release tags: \`openwrt-${OPENWRT_VERSION}-<kernel version>-${RELEASE_DATE}\`"
            echo ""
            echo "SDKs downloaded:"
            echo ""
            cat /tmp/sdk-urls.md
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "openwrt_version=${OPENWRT_VERSION}"
            echo "release_date=${RELEASE_DATE}"
            echo "matrix=$(jq -sc . /tmp/matrix.jsonl)"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Generate one detached BTF blob (and its package) per OpenWrt architecture
  #
  # This follows the current upstream implementation: small stub units are
  # compiled against the kernel headers the SDK already prepared, and pahole
  # converts their DWARF into BTF. No kernel source is downloaded and no kernel
  # is built. The same blob is then packaged with the SDK (vmlinux-btf), so the
  # archive and the installable package always hold identical bytes.
  # ---------------------------------------------------------------------------
  build:
    name: Build vmlinux (${{ matrix.openwrt_arch }})
    needs: prepare
    runs-on: ubuntu-latest
    # Compiling the stubs is fast; downloading and extracting the SDK dominates
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
      KERNEL_ARCH: ${{ matrix.kernel_arch }}
      KERNEL_VERSION: ${{ matrix.kernel_version }}
      SDK_URL: ${{ matrix.sdk_url }}
      SDK_FALLBACK_URL: ${{ matrix.sdk_fallback_url }}
      SDK_NAME: ${{ matrix.sdk_name }}
      DIST_NAME: ${{ matrix.dist_name }}
      BTF_DIST_NAME: ${{ matrix.btf_dist_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # pahole (dwarves) is the only build tool the SDK does not provide,
          # the rest is what the SDK's own make and package build expect
          sudo apt-get install -y --no-install-recommends \
            dwarves xz-utils zstd tar curl ca-certificates file \
            build-essential bzip2 perl python3 rsync unzip git

      - name: Check pahole
        run: |
          set -euo pipefail
          PAHOLE_BIN="$(command -v pahole || true)"
          if [ -z "${PAHOLE_BIN}" ]; then
            echo "::error::pahole is not installed (dwarves package)"
            exit 1
          fi
          echo "pahole: ${PAHOLE_BIN} ($("${PAHOLE_BIN}" --version))"
          # Upstream asks for >= 1.22; an older pahole without detached encoding
          # is still usable through the fallback path in the encode step
          if "${PAHOLE_BIN}" --help 2>&1 | grep -q -- '--btf_encode_detached'; then
            echo "Detached BTF encoding is supported"
          else
            echo "::warning::this pahole cannot write a detached BTF blob, the -J + objcopy fallback will be used"
          fi

      # Official downloads server first, openwrt.pixeldeck.net as the fallback,
      # every download checked against the publisher's sha256sums (see the
      # script). SDK_DIR is exported for the steps below.
      - name: Download and extract the OpenWrt SDK
        run: bash "${GITHUB_WORKSPACE}/scripts/fetch-openwrt-sdk.sh"

      - name: Locate the kernel headers and the toolchain
        run: |
          set -euo pipefail

          echo "SDK directory: ${SDK_DIR}"

          # The SDK ships the target kernel tree already prepared by OpenWrt:
          # headers, the generated include trees and the autoconf.h of that
          # target's .config. This is what upstream's $(LINUX_DIR) points at, and
          # the only kernel input this approach needs. The .c files are stripped
          # from the SDK, which is fine: only headers get included.
          KDIR=""
          while IFS= read -r candidate; do
            if [ -f "${candidate}/include/generated/autoconf.h" ]; then
              KDIR="${candidate}"
              break
            fi
          done < <(find "${SDK_DIR}/build_dir" -maxdepth 4 -type d -path '*linux-*/linux-*' | sort)

          if [ -z "${KDIR}" ]; then
            echo "::error::The SDK does not provide a prepared kernel header tree (expected build_dir/*/linux-*/linux-*/include/generated/autoconf.h)"
            find "${SDK_DIR}/build_dir" -maxdepth 4 -type d -path '*linux-*' | head -n 20 || true
            exit 1
          fi

          for required in \
            include/linux/kconfig.h \
            include/generated/autoconf.h
          do
            if [ ! -f "${KDIR}/${required}" ]; then
              echo "::error::The SDK kernel tree is missing ${required}"
              exit 1
            fi
          done
          # The symlink the package installs next to the blob, vmlinux-<release>,
          # has to match the uname -r of the device. The SDK does not keep
          # include/config/kernel.release, so fall back to UTS_RELEASE of the
          # generated header, which is what uname prints.
          KERNEL_RELEASE=""
          if [ -f "${KDIR}/include/config/kernel.release" ]; then
            KERNEL_RELEASE="$(cat "${KDIR}/include/config/kernel.release")"
          elif [ -f "${KDIR}/include/generated/utsrelease.h" ]; then
            KERNEL_RELEASE="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"$/\1/p' "${KDIR}/include/generated/utsrelease.h")"
          fi
          if [ -z "${KERNEL_RELEASE}" ]; then
            KERNEL_RELEASE="${KERNEL_VERSION}"
            echo "::warning::The SDK kernel tree has neither include/config/kernel.release nor UTS_RELEASE, using ${KERNEL_RELEASE} for the vmlinux-<release> symlink"
          fi
          echo "Kernel release: ${KERNEL_RELEASE}"

          sdk_kernel_version="${KDIR##*/linux-}"
          echo "Kernel tree: ${KDIR}"
          echo "Kernel version in the SDK: ${sdk_kernel_version} (profiles.json reported ${KERNEL_VERSION})"
          if [ "${sdk_kernel_version}" != "${KERNEL_VERSION}" ]; then
            echo "::warning::OpenWrt reports ${KERNEL_VERSION} but the SDK ships ${sdk_kernel_version}"
          fi

          cross_gcc="$(find "${SDK_DIR}"/staging_dir/toolchain-*/bin -maxdepth 1 -name '*-openwrt-linux-musl-gcc' | head -n1)"
          if [ -z "${cross_gcc}" ]; then
            echo "::error::The SDK does not provide a cross toolchain"
            exit 1
          fi
          toolchain_bin="$(dirname "${cross_gcc}")"
          # Absolute prefix, so the stub compile finds the OpenWrt gcc even if
          # PATH is not set up as expected
          cross_prefix="${toolchain_bin}/$(basename "${cross_gcc}" | sed 's/gcc$//')"
          echo "OpenWrt toolchain: ${cross_prefix}"

          # The OpenWrt toolchain looks up its sysroot through $STAGING_DIR and
          # warns "environment variable 'STAGING_DIR' not defined" without it.
          # The buildroot exports STAGING_DIR and STAGING_DIR_HOST (see rules.mk),
          # where STAGING_DIR is staging_dir/target-<arch>_<libc>, not staging_dir
          # itself. Looking it up by glob keeps this identical for x86_64 and for
          # every aarch64 variant.
          staging_dir="$(find "${SDK_DIR}/staging_dir" -mindepth 1 -maxdepth 1 -type d -name 'target-*' | head -n1)"
          if [ -z "${staging_dir}" ]; then
            echo "::error::The SDK does not provide a staging_dir/target-* directory"
            exit 1
          fi
          echo "STAGING_DIR: ${staging_dir}"

          {
            echo "SDK_DIR=${SDK_DIR}"
            echo "KDIR=${KDIR}"
            echo "KERNEL_RELEASE=${KERNEL_RELEASE}"
            echo "CROSS_COMPILE=${cross_prefix}"
            echo "STAGING_DIR=${staging_dir}"
            echo "STAGING_DIR_HOST=${SDK_DIR}/staging_dir/host"
          } >> "$GITHUB_ENV"

          # Also expose the OpenWrt toolchain on PATH, the same way the OpenWrt
          # buildroot does when it builds packages
          echo "${toolchain_bin}" >> "$GITHUB_PATH"

      # The signing key is a repository secret and never a file in git: the
      # script writes it to keys/private-key.pem (the path .gitignore reserves,
      # so a local build looks the same), checks it against the committed public
      # key and links it where the SDK signs with it (BUILD_KEY_APK_SEC). OpenWrt
      # signs each .apk itself when CONFIG_SIGN_EACH_PACKAGE is on, which the
      # build step below enables.
      - name: Set up package signing
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: bash "${GITHUB_WORKSPACE}/scripts/setup-signing-key.sh"

      - name: Verify the OpenWrt toolchain
        run: |
          set -euo pipefail

          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "STAGING_DIR=${STAGING_DIR}"

          # The OpenWrt gcc resolves its sysroot through STAGING_DIR, so an
          # unset or wrong value would silently change what it searches
          if [ ! -d "${STAGING_DIR}" ]; then
            echo "::error::STAGING_DIR '${STAGING_DIR}' does not exist"
            exit 1
          fi

          "${CROSS_COMPILE}gcc" --version | head -n1
          echo "Target triple: $("${CROSS_COMPILE}gcc" -dumpmachine)"

          # Smoke test: cross compile a tiny object, so a broken toolchain fails
          # here instead of later on the stubs
          printf 'int openwrt_gcc_smoke_test(void) { return 0; }\n' > "${RUNNER_TEMP}/smoke.c"
          if ! "${CROSS_COMPILE}gcc" -O2 -c "${RUNNER_TEMP}/smoke.c" -o "${RUNNER_TEMP}/smoke.o" 2> "${RUNNER_TEMP}/smoke.err"; then
            echo "::error::The OpenWrt cross compiler failed to compile a trivial file"
            cat "${RUNNER_TEMP}/smoke.err"
            exit 1
          fi
          cat "${RUNNER_TEMP}/smoke.err"

          if grep -q "STAGING_DIR" "${RUNNER_TEMP}/smoke.err"; then
            echo "::error::The OpenWrt toolchain still complains about STAGING_DIR"
            exit 1
          fi

          file "${RUNNER_TEMP}/smoke.o"

          if [ "${KERNEL_ARCH}" = "x86_64" ]; then
            expected="x86-64"
          else
            expected="aarch64"
          fi

          if file "${RUNNER_TEMP}/smoke.o" | grep -q "${expected}"; then
            echo "Smoke test object is ${expected} - the OpenWrt toolchain works"
          else
            echo "::error::The smoke test object is not ${expected}"
            exit 1
          fi

      - name: Compile the BTF stubs against the SDK kernel headers
        run: |
          set -euo pipefail

          # arch/<karch> inside the kernel tree
          case "${KERNEL_ARCH}" in
            x86_64) LINUX_KARCH=x86 ;;
            arm64)  LINUX_KARCH=arm64 ;;
            *)
              echo "::error::Unsupported kernel arch ${KERNEL_ARCH}"
              exit 1
              ;;
          esac

          # The CPU OpenWrt compiles this target for. Struct layouts do not depend
          # on it, but this keeps the stubs preprocessed like the modules of that
          # target; the SDK toolchains of the generic targets already default to
          # the right CPU.
          arch_flags=()
          case "${OPENWRT_ARCH}" in
            aarch64_cortex-a53) arch_flags+=(-mcpu=cortex-a53) ;;
            aarch64_cortex-a72) arch_flags+=(-mcpu=cortex-a72) ;;
            aarch64_cortex-a76) arch_flags+=(-mcpu=cortex-a76) ;;
          esac

          cc="${CROSS_COMPILE}gcc"

          # BTF_CFLAGS of the upstream Makefile, with the SDK in the role of the
          # OpenWrt buildroot (upstream's $(LINUX_DIR) is ${KDIR})
          btf_cflags=(
            -nostdinc
            -isystem "$("${cc}" -print-file-name=include)"
            -D__KERNEL__
            -include "${KDIR}/include/linux/kconfig.h"
          )
          for extra in \
            "${KDIR}/include/linux/compiler-version.h" \
            "${KDIR}/include/linux/compiler_types.h"
          do
            # compiler-version.h does not exist in older kernels
            if [ -f "${extra}" ]; then
              btf_cflags+=(-include "${extra}")
            fi
          done
          btf_cflags+=(
            -I"${KDIR}/arch/${LINUX_KARCH}/include"
            -I"${KDIR}/arch/${LINUX_KARCH}/include/generated"
            -I"${KDIR}/include"
            -I"${KDIR}/include/generated"
            -I"${KDIR}/arch/${LINUX_KARCH}/include/uapi"
            -I"${KDIR}/arch/${LINUX_KARCH}/include/generated/uapi"
            -I"${KDIR}/include/uapi"
            -I"${KDIR}/include/generated/uapi"
            -I"${KDIR}"
            ${arch_flags[@]+"${arch_flags[@]}"}
            -std=gnu11 -funsigned-char -fshort-wchar -fno-common -fno-PIE
            -O2 -g -gdwarf-4 -fno-eliminate-unused-debug-types
            -Wno-error -Wno-unused-function -Wno-unused-variable
          )

          OUT="${RUNNER_TEMP}/btf"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          echo "Compiling src/shadow_btf_core.c"
          "${cc}" "${btf_cflags[@]}" -c "${GITHUB_WORKSPACE}/src/shadow_btf_core.c" \
            -o "${OUT}/shadow_btf_core.o"

          # Upstream tolerates failures of these two: which of those headers
          # exist depends on the target .config, and the core unit already
          # carries the types that matter most
          for unit in modules private; do
            if ! "${cc}" "${btf_cflags[@]}" -c "${GITHUB_WORKSPACE}/src/shadow_btf_${unit}.c" \
              -o "${OUT}/shadow_btf_${unit}.o" 2> "${OUT}/shadow_btf_${unit}.err"; then
              echo "::warning::src/shadow_btf_${unit}.c does not compile for this target, skipping it (upstream tolerates this too)"
              sed -n '1,20p' "${OUT}/shadow_btf_${unit}.err" || true
              rm -f "${OUT}/shadow_btf_${unit}.o"
            fi
          done

          objs=()
          for obj in "${OUT}"/shadow_btf_*.o; do
            if [ -f "${obj}" ]; then
              objs+=("${obj}")
            fi
          done
          echo "Linking ${#objs[@]} stub object(s)"
          "${CROSS_COMPILE}ld" -r -o "${OUT}/shadow_btf.o" "${objs[@]}"

          # pahole works from DWARF, so the merged object must have some
          if ! "${CROSS_COMPILE}readelf" -S "${OUT}/shadow_btf.o" | grep -q '\.debug_info'; then
            echo "::error::The stub object has no .debug_info section, pahole would have nothing to convert"
            exit 1
          fi
          ls -lh "${OUT}/shadow_btf.o"

      - name: Encode the detached BTF and verify it
        run: |
          set -euo pipefail

          OUT="${RUNNER_TEMP}/btf"

          PAHOLE_BIN="$(command -v pahole)"
          if "${PAHOLE_BIN}" --help 2>&1 | grep -q -- '--btf_encode_detached'; then
            "${PAHOLE_BIN}" --btf_encode_detached="${OUT}/vmlinux" "${OUT}/shadow_btf.o"
          else
            # Older pahole cannot write the blob directly: encode the .BTF
            # section into the object and dump it, which is what the upstream
            # Makefile falls back to
            "${PAHOLE_BIN}" -J "${OUT}/shadow_btf.o"
            "${CROSS_COMPILE}objcopy" --dump-section .BTF="${OUT}/vmlinux" "${OUT}/shadow_btf.o"
          fi

          if [ ! -s "${OUT}/vmlinux" ]; then
            echo "::error::pahole produced no BTF data"
            exit 1
          fi

          # The blob holds the raw BTF data (it is not an ELF file): magic
          # 0xeb9f, version, flags, header length, then the sizes of the type and
          # string sections
          python3 - "${OUT}/vmlinux" <<'PY'
          import struct
          import sys

          data = open(sys.argv[1], "rb").read()
          if len(data) < 24:
              sys.exit(f"BTF blob is too short ({len(data)} bytes)")
          magic, version, flags, hdr_len, type_off, type_len, str_off, str_len = struct.unpack(
              "<HBBIIIII", data[:24]
          )
          if magic != 0xEB9F:
              sys.exit(f"not a BTF blob: magic {magic:#x}")
          if type_len == 0:
              sys.exit("BTF blob contains no types")
          print(
              f"BTF ok: version={version} flags={flags} header_len={hdr_len} "
              f"type_len={type_len} string_len={str_len} file_size={len(data)}"
          )
          PY

          # Upstream's final check: the stub object must describe sk_buff, i.e.
          # pahole really had DWARF types to convert
          "${PAHOLE_BIN}" -C sk_buff "${OUT}/shadow_btf.o" > /dev/null

          ls -lh "${OUT}/vmlinux"
          file "${OUT}/vmlinux" || true

      # The same blob is also an installable package: the repository root is the
      # feed, so the SDK turns vmlinux-btf/ into an apk (ipk on older releases)
      - name: Build the vmlinux-btf package with the SDK
        run: |
          set -euo pipefail

          cd "${SDK_DIR}"
          printf 'src-link local %s\n' "${GITHUB_WORKSPACE}" > feeds.conf
          ./scripts/feeds update local
          ./scripts/feeds install -p local vmlinux-btf

          echo "CONFIG_PACKAGE_vmlinux-btf=m" >> .config
          # Sign the package with the key installed above (OpenWrt's default is
          # already y, but making it explicit here documents the intent)
          if [ "${PACKAGE_SIGNING:-0}" = "1" ]; then
            echo "CONFIG_SIGN_EACH_PACKAGE=y" >> .config
          fi
          make defconfig

          # The kernel version is the package version, and the blob is the one
          # this job just encoded: the package only installs it
          VMLINUX_BTF_VERSION="${KERNEL_VERSION}" \
          VMLINUX_BTF_KERNEL_RELEASE="${KERNEL_RELEASE}" \
          VMLINUX_BTF_SRC="${RUNNER_TEMP}/btf/vmlinux" \
            make package/vmlinux-btf/compile V=s

      # The committed public key is the trust anchor, the same one a device
      # uses: this fails when the package is unsigned, when the key does not
      # match, or when the signature is broken
      - name: Verify the package signatures
        if: env.PACKAGE_SIGNING == '1'
        run: |
          set -euo pipefail

          mapfile -t packages < <(find "${SDK_DIR}/bin/packages" -name '*.apk' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .apk package was produced, nothing to verify"
            exit 0
          fi

          apk="${SDK_DIR}/staging_dir/host/bin/apk"
          if [ ! -x "${apk}" ]; then
            echo "::error::${apk} does not exist, the signature cannot be verified"
            exit 1
          fi

          for package in "${packages[@]}"; do
            "${apk}" --keys-dir "${GITHUB_WORKSPACE}/keys" verify -v "${package}"
          done

      - name: Collect the vmlinux-btf package
        run: |
          set -euo pipefail

          mapfile -t found < <(find "${SDK_DIR}/bin/packages" \
            \( -name 'vmlinux-btf-*.apk' -o -name 'vmlinux-btf_*.ipk' \) | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one vmlinux-btf package, found ${#found[@]}"
            find "${SDK_DIR}/bin" -type f | sed -n '1,50p' || true
            exit 1
          fi

          # OpenWrt 25.x publishes apk, older releases ipk
          ext="${found[0]##*.}"
          mkdir -p dist
          cp "${found[0]}" "dist/${BTF_DIST_NAME}.${ext}"
          ( cd dist && sha256sum "${BTF_DIST_NAME}.${ext}" | tee "${BTF_DIST_NAME}.${ext}.sha256" )

          {
            echo "### ${BTF_DIST_NAME}"
            echo ""
            echo "- Package: \`$(basename "${found[0]}")\`"
            echo "- Version: \`${KERNEL_VERSION}\` (kernel version)"
            echo "- Kernel release: \`${KERNEL_RELEASE}\`"
            echo "- OpenWrt arch: \`${OPENWRT_ARCH}\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "dist/${BTF_DIST_NAME}.${ext}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package ${{ matrix.dist_name }}.tar.xz
        run: |
          set -euo pipefail

          OUT_DIR="${RUNNER_TEMP}/pkg"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          # The packaged file must be named exactly "vmlinux": that is where
          # libbpf and bpftool look for the BTF of the running kernel
          cp "${RUNNER_TEMP}/btf/vmlinux" "${OUT_DIR}/vmlinux"
          ls -lh "${OUT_DIR}/vmlinux"

          ARCHIVE="${DIST_NAME}.tar.xz"
          # Everything of this job is collected in dist/, so the uploaded
          # artifact has a single root and the release job finds the files flat
          mkdir -p dist
          tar -C "${OUT_DIR}" -cf - vmlinux | xz -T0 -6 > "dist/${ARCHIVE}"

          sha256sum "dist/${ARCHIVE}" | tee "dist/${ARCHIVE}.sha256"

          echo "===== Archive contents ====="
          tar -tvJf "dist/${ARCHIVE}"
          ls -lh "dist/${ARCHIVE}"

          {
            echo "### ${DIST_NAME}"
            echo ""
            echo '```'
            tar -tvJf "dist/${ARCHIVE}"
            echo '```'
            echo ""
            echo "- OpenWrt version: \`${OPENWRT_VERSION}\`"
            echo "- OpenWrt arch: \`${OPENWRT_ARCH}\`"
            echo "- Kernel version: \`${KERNEL_VERSION}\`"
            echo "- Kernel headers: \`${KDIR}\`"
            echo "- pahole: \`$(pahole --version)\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "dist/${ARCHIVE}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dist_name }}
          path: dist/*
          # Already compressed, no need to compress again
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Userspace packages: dae (Go) and honk (Rust)
  #
  # The build recipes are the OpenWrt packages under dae/ and honk/; these jobs
  # only install the toolchains and let the SDK build them. dae is pure Go
  # (CGO_ENABLED=0); honk uses the SDK cross toolchain because its C/C++
  # dependencies and the final link need the target compiler and musl.
  # Both are pinned to upstream release tags, the versions come from the matrix.
  # ---------------------------------------------------------------------------
  dae:
    name: Build dae (${{ matrix.openwrt_arch }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # One build per OpenWrt architecture, like the kernel assets
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # No kernel version here: the userspace assets carry the pinned upstream
      # version instead (see the header comment)
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
      DAE_VERSION: ${{ matrix.dae_version }}
      SDK_URL: ${{ matrix.sdk_url }}
      SDK_FALLBACK_URL: ${{ matrix.sdk_fallback_url }}
      SDK_NAME: ${{ matrix.sdk_name }}
      DIST_NAME: ${{ matrix.dae_dist_name }}
    steps:
      # The repository root is an OpenWrt feed (dae/ and honk/ are packages)
      - name: Checkout this repository (feed)
        uses: actions/checkout@v7

      - name: Checkout dae sources into the package directory
        uses: actions/checkout@v7
        with:
          repository: daeuniverse/dae
          ref: ${{ matrix.dae_git_tag }}
          # control/kern/headers and trace/kern/headers are submodules
          submodules: recursive
          path: dae/src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dae/src/go.mod
          # The package build runs in the SDK tree, so the module cache cannot be
          # keyed on this repository
          cache: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # Host tools the OpenWrt SDK's make expects, plus clang for the eBPF
          # objects that bpf2go embeds
          sudo apt-get install -y --no-install-recommends \
            build-essential bzip2 perl python3 rsync unzip git ca-certificates file
          if ! sudo apt-get install -y --no-install-recommends clang-15 llvm-15; then
            echo "::warning::clang-15 is not available, falling back to the default clang"
            sudo apt-get install -y --no-install-recommends clang llvm
          fi

      # Official downloads server first, openwrt.pixeldeck.net as the fallback,
      # every download checked against the publisher's sha256sums (see the
      # script). SDK_DIR is exported for the steps below.
      - name: Download and extract the OpenWrt SDK
        run: bash "${GITHUB_WORKSPACE}/scripts/fetch-openwrt-sdk.sh"

      # Same signing set-up as in the kernel job, see
      # scripts/setup-signing-key.sh
      - name: Set up package signing
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: bash "${GITHUB_WORKSPACE}/scripts/setup-signing-key.sh"

      # The build recipe lives in dae/ (an OpenWrt package), not here: the SDK
      # compiles it and produces the apk package
      - name: Build the dae apk with the SDK
        run: |
          set -euo pipefail

          cd "${SDK_DIR}"
          printf 'src-link local %s\n' "${GITHUB_WORKSPACE}" > feeds.conf
          ./scripts/feeds update local
          ./scripts/feeds install -p local dae

          if [ "${PACKAGE_SIGNING:-0}" = "1" ]; then
            echo "CONFIG_SIGN_EACH_PACKAGE=y" >> .config
          fi
          make defconfig

          # CONFIG_PACKAGE_dae cannot be selected in the SDK: dae depends on
          # kmod-xdp-sockets-diag, whose KernelPackage is @KERNEL_XDP_SOCKETS,
          # and the SDK kernel ships that option disabled. defconfig therefore
          # drops the symbol from .config, and without it the SDK's compile
          # target has no rule for the package at all: make exits 0 without
          # building anything. Pass the symbol on the command line instead
          # (command-line variables win over .config): the package is built and
          # packaged as if it had been selected, and its runtime dependencies
          # (ca-bundle, kmod-*) still end up in the package metadata.
          #
          # One value for the package version and the version the binary reports
          DAE_VERSION="${DAE_VERSION}" make package/dae/compile V=s CONFIG_PACKAGE_dae=m

          # make is silent about a package that was not selected, which is how
          # a missing apk used to reach the collect step as if the build had
          # worked: fail here instead
          mapfile -t built < <(find "${SDK_DIR}/bin/packages" \
            \( -name 'dae-*.apk' -o -name 'dae_*.ipk' \) 2>/dev/null)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::The SDK produced ${#built[@]} dae packages, expected one"
            find "${SDK_DIR}/bin" -type f | sed -n '1,50p' || true
            exit 1
          fi

      - name: Verify the package signatures
        if: env.PACKAGE_SIGNING == '1'
        run: |
          set -euo pipefail

          mapfile -t packages < <(find "${SDK_DIR}/bin/packages" -name '*.apk' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .apk package was produced, nothing to verify"
            exit 0
          fi

          apk="${SDK_DIR}/staging_dir/host/bin/apk"
          if [ ! -x "${apk}" ]; then
            echo "::error::${apk} does not exist, the signature cannot be verified"
            exit 1
          fi

          for package in "${packages[@]}"; do
            "${apk}" --keys-dir "${GITHUB_WORKSPACE}/keys" verify -v "${package}"
          done

      - name: Collect the dae package
        run: |
          set -euo pipefail

          mapfile -t found < <(find "${SDK_DIR}/bin/packages" \
            \( -name 'dae-*.apk' -o -name 'dae_*.ipk' \) | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one dae package, found ${#found[@]}"
            find "${SDK_DIR}/bin" -type f | sed -n '1,50p' || true
            exit 1
          fi

          # OpenWrt 25.x publishes apk, older releases ipk
          ext="${found[0]##*.}"
          mkdir -p dist
          cp "${found[0]}" "dist/${DIST_NAME}.${ext}"
          ( cd dist && sha256sum "${DIST_NAME}.${ext}" | tee "${DIST_NAME}.${ext}.sha256" )

          {
            echo "### ${DIST_NAME}"
            echo ""
            echo "- Package: \`$(basename "${found[0]}")\`"
            echo "- OpenWrt version: \`${OPENWRT_VERSION}\`"
            echo "- OpenWrt arch: \`${OPENWRT_ARCH}\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "dist/${DIST_NAME}.${ext}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_NAME }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  honk:
    name: Build honk (${{ matrix.openwrt_arch }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One build per OpenWrt architecture, like the kernel assets: the Rust
      # target and the C/C++ compiler both come from that architecture's SDK
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # No kernel version here: the userspace assets carry the pinned upstream
      # version instead (see the header comment)
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
      KERNEL_ARCH: ${{ matrix.kernel_arch }}
      HONK_VERSION: ${{ matrix.honk_version }}
      HONK_GIT_TAG: ${{ matrix.honk_git_tag }}
      SDK_URL: ${{ matrix.sdk_url }}
      SDK_FALLBACK_URL: ${{ matrix.sdk_fallback_url }}
      SDK_NAME: ${{ matrix.sdk_name }}
      DIST_NAME: ${{ matrix.honk_dist_name }}
    defaults:
      run:
        # The sources live in the package directory, see honk/Makefile
        working-directory: honk/src
    steps:
      # The repository root is an OpenWrt feed (dae/ and honk/ are packages)
      - name: Checkout this repository (feed)
        uses: actions/checkout@v7

      - name: Checkout honk sources into the package directory
        uses: actions/checkout@v7
        with:
          repository: daeuniverse/honk
          ref: ${{ matrix.honk_git_tag }}
          # honk's build script derives the embedded version from the tag/git
          # description, so the full history and the tag are needed
          fetch-depth: 0
          path: honk/src

      # Official downloads server first, openwrt.pixeldeck.net as the fallback,
      # every download checked against the publisher's sha256sums (see the
      # script). SDK_DIR is exported for the steps below.
      - name: Download and extract the OpenWrt SDK
        run: bash "${GITHUB_WORKSPACE}/scripts/fetch-openwrt-sdk.sh"

      - name: Locate the toolchain
        run: |
          set -euo pipefail

          echo "SDK directory: ${SDK_DIR}"
          cross_gcc="$(find "${SDK_DIR}"/staging_dir/toolchain-*/bin -maxdepth 1 -name '*-openwrt-linux-musl-gcc' | head -n1)"
          cross_gxx="$(find "${SDK_DIR}"/staging_dir/toolchain-*/bin -maxdepth 1 -name '*-openwrt-linux-musl-g++' | head -n1)"

          if [ -z "${SDK_DIR}" ] || [ -z "${cross_gcc}" ] || [ -z "${cross_gxx}" ]; then
            echo "::error::The SDK is missing its toolchain"
            exit 1
          fi

          toolchain_bin="$(dirname "${cross_gcc}")"
          echo "OpenWrt C compiler:   ${cross_gcc}"
          echo "OpenWrt C++ compiler: ${cross_gxx}"

          # The package build below runs the SDK's own make, which sets
          # CROSS_COMPILE/STAGING_DIR itself; only the SDK path is needed here
          echo "SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${toolchain_bin}" >> "$GITHUB_PATH"

      # Same signing set-up as in the kernel job, see
      # scripts/setup-signing-key.sh
      - name: Set up package signing
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: bash "${GITHUB_WORKSPACE}/scripts/setup-signing-key.sh"

      - name: Resolve the Rust target
        id: rust_target
        run: |
          set -euo pipefail

          # OpenWrt is musl based, so the musl targets are the right ones
          case "${KERNEL_ARCH}" in
            x86_64) target=x86_64-unknown-linux-musl ;;
            arm64)  target=aarch64-unknown-linux-musl ;;
            *)
              echo "::error::Unsupported kernel arch ${KERNEL_ARCH}"
              exit 1
              ;;
          esac

          echo "target=${target}" >> "$GITHUB_OUTPUT"
          echo "TARGET=${target}" >> "$GITHUB_ENV"
          echo "Rust target: ${target}"

      - name: Read the pinned Rust toolchains
        id: toolchain
        run: |
          set -euo pipefail
          echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      # Ready-made toolchains: rustup installs the compiler and the prebuilt
      # std for the target, no cross toolchain build is involved
      - name: Install Rust stable (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.stable }}
          target: ${{ steps.rust_target.outputs.target }}

      - name: Install Rust nightly (for the eBPF object)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # The Rust/C needs of honk, plus the host tools the SDK's make expects
          sudo apt-get install -y clang llvm libbpf-dev pkg-config cmake libclang-dev zstd \
            build-essential bzip2 perl python3 rsync unzip git ca-certificates file

      - name: Install the pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  ${RUNNER_TEMP}/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "${RUNNER_TEMP}/bpf-linker.tar.zst" | tar -xf - -C "${CARGO_HOME}/bin"
          bpf-linker --version

      # The build recipe lives in honk/ (an OpenWrt package), not here: the SDK
      # compiles it with the toolchains installed above and produces the apk
      - name: Build the honk apk with the SDK
        run: |
          set -euo pipefail

          cd "${SDK_DIR}"
          printf 'src-link local %s\n' "${GITHUB_WORKSPACE}" > feeds.conf
          ./scripts/feeds update local
          ./scripts/feeds install -p local honk

          echo "CONFIG_PACKAGE_honk=m" >> .config
          if [ "${PACKAGE_SIGNING:-0}" = "1" ]; then
            echo "CONFIG_SIGN_EACH_PACKAGE=y" >> .config
          fi
          make defconfig

          # One value for the package version and the version the binary reports
          HONK_VERSION="${HONK_VERSION}" HONK_GIT_TAG="${HONK_GIT_TAG}" \
            make package/honk/compile V=s

      - name: Verify the package signatures
        if: env.PACKAGE_SIGNING == '1'
        run: |
          set -euo pipefail

          mapfile -t packages < <(find "${SDK_DIR}/bin/packages" -name '*.apk' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .apk package was produced, nothing to verify"
            exit 0
          fi

          apk="${SDK_DIR}/staging_dir/host/bin/apk"
          if [ ! -x "${apk}" ]; then
            echo "::error::${apk} does not exist, the signature cannot be verified"
            exit 1
          fi

          for package in "${packages[@]}"; do
            "${apk}" --keys-dir "${GITHUB_WORKSPACE}/keys" verify -v "${package}"
          done

      - name: Collect the honk package
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"

          mapfile -t found < <(find "${SDK_DIR}/bin/packages" \
            \( -name 'honk-*.apk' -o -name 'honk_*.ipk' \) | sort)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one honk package, found ${#found[@]}"
            find "${SDK_DIR}/bin" -type f | sed -n '1,50p' || true
            exit 1
          fi

          # OpenWrt 25.x publishes apk, older releases ipk
          ext="${found[0]##*.}"
          mkdir -p dist
          cp "${found[0]}" "dist/${DIST_NAME}.${ext}"
          ( cd dist && sha256sum "${DIST_NAME}.${ext}" | tee "${DIST_NAME}.${ext}.sha256" )

          {
            echo "### ${DIST_NAME}"
            echo ""
            echo "- Package: \`$(basename "${found[0]}")\`"
            echo "- OpenWrt version: \`${OPENWRT_VERSION}\`"
            echo "- OpenWrt arch: \`${OPENWRT_ARCH}\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "dist/${DIST_NAME}.${ext}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_NAME }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish one GitHub Release per kernel version, collecting the assets of
  #    every architecture that shares it (the archive and the vmlinux-btf
  #    package, plus the userspace binaries)
  #    tag = openwrt-<openwrt_version>-<kernel_version>-<date>
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub releases
    needs: [prepare, build, dae, honk]
    # A partial set is not a release: any failed matrix leg (kernel, dae or
    # honk) skips publishing. `success()` is false when a needed job failed or
    # was skipped, which is what a failed matrix leg does to its siblings.
    if: ${{ success() }}
    runs-on: ubuntu-latest
    # Writing to a release needs contents: write (the workflow default is read)
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
      RELEASE_DATE: ${{ needs.prepare.outputs.release_date }}
      MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check whether the tag and the release already exist
        run: |
          set -euo pipefail

          state="${RUNNER_TEMP}/release-state.jsonl"
          : > "${state}"

          mapfile -t kernel_versions < <(jq -r '[.[].kernel_version] | unique[]' <<< "${MATRIX_JSON}")
          if [ "${#kernel_versions[@]}" -eq 0 ]; then
            echo "::error::The build matrix does not contain any kernel version"
            exit 1
          fi

          for kernel_version in "${kernel_versions[@]}"; do
            tag="openwrt-${OPENWRT_VERSION}-${kernel_version}-${RELEASE_DATE}"

            release_exists=false
            if gh release view "${tag}" >/dev/null 2>&1; then
              release_exists=true
              echo "Release ${tag} already exists - skipping creation, assets will be overwritten."
            else
              echo "Release ${tag} does not exist - it will be created."
            fi

            tag_exists=false
            if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              tag_exists=true
              echo "Tag ${tag} already exists - it will be reused."
            else
              echo "Tag ${tag} does not exist - gh will create it."
            fi

            jq -nc \
              --arg tag "${tag}" \
              --arg kernel_version "${kernel_version}" \
              --argjson release_exists "${release_exists}" \
              --argjson tag_exists "${tag_exists}" \
              '{tag:$tag,kernel_version:$kernel_version,release_exists:$release_exists,tag_exists:$tag_exists}' \
              >> "${state}"
          done

          echo "Resolved $(wc -l < "${state}") release(s)"

      - name: Create tag and release with gh
        env:
          # Only a boolean, never the key itself: the note below must match what
          # was actually published
          SIGNING_KEY_AVAILABLE: ${{ secrets.PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail

          mapfile -t states < "${RUNNER_TEMP}/release-state.jsonl"

          for entry in "${states[@]}"; do
            IFS=$'\t' read -r tag kernel_version release_exists tag_exists \
              <<< "$(jq -r '[.tag, .kernel_version, (.release_exists|tostring), (.tag_exists|tostring)] | @tsv' <<< "${entry}")"

            if [ "${release_exists}" = "true" ]; then
              echo "Release ${tag} already exists - skipping creation."
              continue
            fi

            mapfile -t assets < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | "- " + .dist_name + ".tar.xz  (OpenWrt arch " + .openwrt_arch + ", " + .target + "/" + .subtarget + ")"' \
              <<< "${MATRIX_JSON}")

            # The same blob as an installable package, one per architecture
            mapfile -t btf_assets < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | "- " + .btf_dist_name + ".apk  (OpenWrt arch " + .openwrt_arch + ")"' \
              <<< "${MATRIX_JSON}")

            # Claim only what was actually published: the secret is not enough,
            # the assets have to be .apk files for them to be signed at all
            if [ "${SIGNING_KEY_AVAILABLE}" = "true" ] && ls dist/*.apk > /dev/null 2>&1; then
              apk_install="apk add <file>"
              printf -v signing_note '%s\n' \
                "public-key.pem, attached to this release, belongs to the key these" \
                "packages are signed with: copy it to /etc/apk/keys/ on the device" \
                "(the file name does not matter, apk matches the key itself) and" \
                "\"apk add <file>\" verifies the signature. Without it apk rejects" \
                "the packages as untrusted."
            else
              apk_install="apk add --allow-untrusted <file>"
              printf -v signing_note '%s\n' \
                "The .apk packages are not signed in this release, so apk needs" \
                "--allow-untrusted. Compare the published .sha256 checksums" \
                "instead."
            fi

            cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          vmlinux with embedded BTF, for CO-RE eBPF programs.

          - OpenWrt version: ${OPENWRT_VERSION}
          - Kernel version: ${kernel_version}

          Assets:

          $(printf '%s\n' "${assets[@]}")

          The same BTF blob is published as an installable package of this
          OpenWrt version, one per architecture (extension .apk on 25.x,
          .ipk on older releases):

          $(printf '%s\n' "${btf_assets[@]}")

          Userspace packages (dae, honk) for all OpenWrt architectures of this
          run, when available, are attached as well. They are pinned to upstream
          releases and do not depend on the kernel version:

          - <openwrt_version>-dae-2.1.1-<openwrt_arch>.apk
          - <openwrt_version>-honk-0.1.0_beta1-<openwrt_arch>.apk

          Both packages install an OpenWrt procd init script and a UCI
          configuration (/etc/config/dae, /etc/config/honk); the service is
          disabled until "option enabled '1'" is set. honk is built with the
          full feature set and embeds the doona UI (native-ui): configure
          experimental.native_api with "ui: embedded" to serve it.

          These are OpenWrt packages (.apk on 25.x, .ipk on older releases),
          install them with "${apk_install}" or "opkg install <file>"
          respectively.

          ${signing_note}
          Every archive contains a single file named vmlinux, plus its .sha256
          checksum.

          Build recipe: the stub sources of QiuSimons/vmlinux-btf, compiled
          against the kernel headers the official OpenWrt SDK ships for this
          target and converted to BTF with pahole.

          Built by GitHub Actions run #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA}.
          EOF

            args=(--title "${tag}" --notes-file "${RUNNER_TEMP}/release-notes.md")
            if [ "${tag_exists}" = "false" ]; then
              # Point the newly created tag at the commit this workflow ran on
              args+=(--target "${GITHUB_SHA}")
            fi

            gh release create "${tag}" "${args[@]}"
          done

      - name: Upload archives with gh
        run: |
          set -euo pipefail

          mapfile -t states < "${RUNNER_TEMP}/release-state.jsonl"

          for entry in "${states[@]}"; do
            IFS=$'\t' read -r tag kernel_version \
              <<< "$(jq -r '[.tag, .kernel_version] | @tsv' <<< "${entry}")"

            files=()
            mapfile -t dist_names < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | .dist_name' <<< "${MATRIX_JSON}")

            for dist_name in "${dist_names[@]}"; do
              if [ -f "dist/${dist_name}.tar.xz" ]; then
                files+=("dist/${dist_name}.tar.xz")
              fi
              if [ -f "dist/${dist_name}.tar.xz.sha256" ]; then
                files+=("dist/${dist_name}.tar.xz.sha256")
              fi
            done

            # The vmlinux-btf package belongs to this kernel version as well;
            # its extension is apk on 25.x and ipk on older releases
            mapfile -t btf_names < <(jq -r --arg kv "${kernel_version}" \
              '.[] | select(.kernel_version == $kv) | .btf_dist_name' <<< "${MATRIX_JSON}")

            for name in "${btf_names[@]}"; do
              for path in "dist/${name}".*; do
                if [ -f "${path}" ]; then
                  files+=("${path}")
                fi
              done
            done

            # Userspace packages: they do not depend on the kernel version, so
            # every release published by this run carries the full set. Their
            # names come from the matrix (pinned upstream version), one package
            # per OpenWrt architecture; the extension is apk on 25.x and ipk on
            # older releases.
            mapfile -t userspace_names < <(jq -r '[.[] | .dae_dist_name, .honk_dist_name] | unique[]' <<< "${MATRIX_JSON}")

            for name in "${userspace_names[@]}"; do
              for path in "dist/${name}".*; do
                if [ -f "${path}" ]; then
                  files+=("${path}")
                fi
              done
            done

            # The public key that verifies the signatures of every .apk of this
            # release; it is also committed to the repository as
            # keys/public-key.pem
            if [ -f "keys/public-key.pem" ]; then
              files+=("keys/public-key.pem")
            fi

            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No archives found in dist/ for ${tag}, did the build jobs upload their artifacts?"
              exit 1
            fi

            echo "Uploading to ${tag}:"
            printf '  %s\n' "${files[@]}"
            gh release upload "${tag}" "${files[@]}" --clobber

            # The upload already succeeded, so do not fail the step if the
            # summary lookup goes wrong
            {
              echo "### Release ${tag}"
              echo ""
              echo "- URL: $(gh release view "${tag}" --json url -q .url || true)"
              echo "- Assets:"
              gh release view "${tag}" --json assets -q '.assets[].name' 2>/dev/null \
                | sed 's/^/  - /' || true
            } >> "$GITHUB_STEP_SUMMARY"
          done
